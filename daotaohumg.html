<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>daotao HUMG</title>
    <style>
        body{
            margin:0px;
        }
        ul{
            margin:0px;
        }
        .menu{
            background-color:#2fa4e7;
            margin: 0px;
        }
        .danh-sách-mục{
       /*bỏ dấu chấm của list*/ 
       list-style:none;
       margin:0px;
       display: flex;
       padding:10px;
       /*set các đối tượng bọc trong khối tự động cách nhau khoảng cách = giá trị truyên vào */
       gap:15px
        }
        .lien-ket-mục{
        /*background-color: red;*/
        padding: 15px;
        /*font-weight : bold;*/
        }
        a{
            color:white ;
            text-decoration:none ;
        }
        main{
            display: flex;
        }
        .khoi-trai{
    
            width : 20%;
            height: 90vh;
            /*để vẽ đường viền border 
            borden sẽ có 3 tham số (độ dày - loại đường viền - màu sắc ) 
            */
            border-right: 1px solid #2fa4e7 ;

        }
        p{
            margin:0px;
        }
        .input{
            width : 100%;
            padding : 5px 0 ;
        }
        
        .khoi-dang-nhap{
            width :90%;
            height: 300px;
            /* nếu margin để auto sẽ căn đối tượng ra giữa */
            margin: 10px auto;
        }
        .quen-mk{
            display: flex;
            justify-self: flex-end;

        }
        .lien-ket-quen-mk{
            text-decoration:none ;
            color:#2fa4e7
        }
        .thong-tin{
            margin-bottom: 10px;
        }
        button{
            width:100%;
            padding: 5px 0;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid #dedede;
        }
        .dang-nhap{
            background-color: #2fa4e7;
        }
        .dang-nhap-365{
            background-color: #2fa4e7;
        }
        .khoi-phai{
            width : 80%;
            height: 90vh;
        }
        .tin{
            width : 95% ;
            height: 300px;
            margin: 20px auto;
            border: 1px solid #2fa4e7;
            border-radius: 10px;
        }
        .tin-tren{
            width:95% ;
            margin: auto ;
            border-bottom: 1px solid #2fa4e7;
            display: flex;
            justify-content: space-between;
            padding: 10px ;
        }
        h3{
            margin: 0;
        }
        .xem-tiep{
            color :#2fa4e7;
            text-decoration: note;
        }
    </style>
</head>
<body>
    <!-- Thanh menu-->
        <nav class="menu">
            <ul class="danh-sách-mục">
                <li class="mục"><a href="#">Thực tập, đồ án</a></li>
                <li class="mục"><a href="#">Thủ tục một cửa </a></li>
                <li class="mục"><a href="#"> Một cửa online</a></li>
                <li class="mục"><a href="#"> E-mail HUMG </a></li>
            </ul>
        </nav>
        <!-- Nội dung chính -->
        <main> 
            <div class="khoi-trai">
             <div class="khoi-dang-nhap">
                <form action="">
                    <div class="thong-tin">
                        <p> Tài khoản</p>
                        <input type="text" >
                    </div>
                    <div class="thong-tin">
                        <p> Mật khẩu </p>
                        <input type="password">
                    </div>
                    <div class="quen-mk">
                        <i>
                            <a class="lien-ket-quen-mk"> Quên mật khẩu</a>
                        </i>
                    </div>
                    <div class="chuc-nang-dang-nhap">
                        <button class="dang-nhap">Đăng Nhập </button>
                        <button class="dang-nhap-365"> Đăng nhập với Microsoft ofice 365</button>
                    </div>
                </form>
            </div>
            </div>
            <div class="khoi-phai">
                <div class="tin"> 
                    <div class=tin-tren >
                        <h3 class="tieu-de" > Tin tức </h3>
                        <p>
                            <a class="xem-tiep" href=""> Xem tiếp></a>
                        </p>
                    </div>
                </div>
            </div>
        </main>
</body>
</html>
