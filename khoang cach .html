    margin: 10px 50px 100px  200px;

}
.khoi-3{
    background-color:yellow;
    padding: 10px 50px 100px 200px
}

</head>
<body>
    <div class="khoi-1"> khoi 1</div>
    <div class="khoi-2"> khoi 2</div>
